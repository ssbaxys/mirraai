<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirra AI — Технические работы</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background: #060606;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }

        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 32px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #8e43ff, #ff4757);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: rgba(255, 255, 255, 0.6);
            max-width: 400px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="icon">🛠️</div>
    <h1>Технические работы</h1>
    <p>Мы проводим важное обновление системы, чтобы Mirra AI стала еще лучше. <br>Пожалуйста, возвращайтесь чуть позже!
    </p>

    <div style="display:flex; gap:16px;">
        <a href="index.html" class="btn primary">Проверить доступ</a>
    </div>

    <div style="margin-top:40px;">
        <a href="index.html?action=admin_bypass" class="btn secondary" style="font-size:12px; padding: 8px 16px;">
            Вход для администратора
        </a>
    </div>

</body>

</html>
